replicaCount: 4

image:
  repository: ""
  tag: ""
  pullPolicy: Always

container:
  port: 8080

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: java-demo.example.com
  path: /
  pathType: Prefix
